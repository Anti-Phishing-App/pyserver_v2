version: '3.8'

services:
  # 1️⃣ 카운터 (API 서버)
  api_server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: api_server
    ports:
      - "8000:8000"  # 외부에서 8000번으로 접속하면 카운터로 연결
    volumes:
      - ./api_server:/app
      - ./api_server/uploads:/app/uploads
      - ./api_server/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
      - AI_SERVER_BASE_URL=http://ai_server:8001
    restart: always
    networks:
      - phishing_network

  # 2️⃣ 주방 (AI 서버)
  ai_server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: ai_server
    ports:
      - "8001:8001"  # 외부에서 8001번으로 접속하면 주방으로 연결
    volumes:
      - ./ai_server:/app
      - ./ai_server/data:/app/data
      - ./model:/model:ro
    environment:
      - PUBLIC_WS_BASE=wss://gupi99.p-e.kr
      - CLOVA_SPEECH_LONGFORM_INVOKE_URL=${CLOVA_SPEECH_LONGFORM_INVOKE_URL}
      - CLOVA_SPEECH_LONGFORM_SECRET_KEY=${CLOVA_SPEECH_LONGFORM_SECRET_KEY}
      - CLOVA_SPEECH_STREAMING_SECRET_KEY=${CLOVA_SPEECH_STREAMING_SECRET_KEY}
      - CLOVA_SPEECH_STREAMING_GRPC_TARGET=${CLOVA_SPEECH_STREAMING_GRPC_TARGET}
      - CLOVA_INVOKE_URL=${CLOVA_INVOKE_URL:-}
      - CLOVA_SECRET_KEY=${CLOVA_SECRET_KEY:-}
      - CLOVA_API_URL=${CLOVA_API_URL}
      - CLOVA_SECRET_KEY2=${CLOVA_SECRET_KEY2}
      - PHONE_ML_BACKEND=${PHONE_ML_BACKEND:-koelectra}
      - PHONE_KE_MODEL_DIR=${PHONE_KE_MODEL_DIR:-/model/call(KE)/call_koelectra_model_v3}
      - PHONE_ML_THRESHOLD=${PHONE_ML_THRESHOLD:-0.01}
      - SMS_ML_THRESHOLD=0.5
    restart: always
    networks:
      - phishing_network

networks:
  phishing_network:
    driver: bridge